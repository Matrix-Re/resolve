stages:
  - quality
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt

ruff:
  stage: quality
  image: python:3.13
  script:
    - ruff check .
    - ruff format --check .

tests:
  stage: test
  image: python:3.13
  script:
    - pytest --junitxml=report.xml --cov=. --cov-report=term-missing --cov-fail-under=80
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - report.xml
      - coverage.xml