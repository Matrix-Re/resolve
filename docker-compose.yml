services:
  authoritative:
    build: .
    container_name: resolve-authoritative
    command: >
      python -m servers.authoritative_server
      --host 0.0.0.0
      --port 5303
      --zones-path data/zones
    volumes:
      - ./data:/app/data
    ports:
      - "5303:5303/udp"

  tld:
    build: .
    container_name: resolve-tld
    command: >
      python -m servers.tld_server
      --host 0.0.0.0
      --port 5302
      --config data/docker/tld.json
    volumes:
      - ./data:/app/data
    ports:
      - "5302:5302/udp"
    depends_on:
      - authoritative

  root:
    build: .
    container_name: resolve-root
    command: >
      python -m servers.root_server
      --host 0.0.0.0
      --port 5301
      --config data/docker/root.json
    volumes:
      - ./data:/app/data
    ports:
      - "5301:5301/udp"
    depends_on:
      - tld

  resolver:
    build: .
    container_name: resolve-resolver
    command: >
      python -m resolver.recursive_resolver
      --host 0.0.0.0
      --port 5300
      --root-host root
      --root-port 5301
    ports:
      - "5300:5300/udp"
    depends_on:
      - root